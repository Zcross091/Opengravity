name: OpenGravity IDE Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'ide/**'
      - 'server/**'
      - 'shared/**'
      - 'client/**'
      - '.github/workflows/opengravity-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release OpenGravity IDE (.exe)
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Core Libraries & Server
        run: |
          npm run build -w server
          npm run build -w client

      - name: Install & Build OpenGravity Daemon
        working-directory: ide/daemon
        run: |
          npm install
          npm run build

      - name: Install & Build OpenGravity Extension
        working-directory: ide/extension
        run: |
          npm install
          npm run build

      - name: Package VSIX Extension
        working-directory: ide/extension
        run: |
          npx @vscode/vsce package --no-dependencies --out ../dist-electron/opengravity-extension.vsix
        continue-on-error: true

      - name: Build Windows IDE.exe Installer (NSIS & Portable ZIP)
        working-directory: ide
        run: |
          npm install
          npx electron-builder --win --x64 --publish never

      - name: Generate SHA-256 Checksums
        working-directory: ide/dist-electron
        shell: pwsh
        run: |
          Get-ChildItem -File -Recurse | Where-Object { $_.Extension -in '.exe', '.zip', '.vsix' } | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii SHA256SUMS.txt
          }
          Get-Content SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-build.${{ github.run_number }}"
          name: "OpenGravity IDE Build ${{ github.run_number }} (${{ github.sha }})"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ide/dist-electron/*.exe
            ide/dist-electron/*.zip
            ide/dist-electron/*.vsix
            ide/dist-electron/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
