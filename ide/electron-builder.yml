appId: org.opengravity.ide
productName: OpenGravity
electronVersion: 33.2.1
directories:
  output: dist-electron
files:
  - main.js
  - package.json
  - daemon/dist/**/*
  - daemon/package.json
  - extension/dist/**/*
  - extension/package.json
  - extension/media/**/*
  - build/product.json
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: "OpenGravity-Setup-${version}.${ext}"
  oneClick: true
  deleteAppDataOnUninstall: false
